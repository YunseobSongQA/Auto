<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>품질 관리 중 생기는 문제를, 바로 도구로 — QA Automation</title>
  <meta name="description" content="QA를 하며 마주치는 반복 업무를 자동화합니다. 증적 수집부터 기획서 기반 테스트케이스 작성, 자동화 테스트까지 필요한 도구를 직접 만들어 실무에 활용하고, 실행 영상과 측정 수치까지 공개합니다." />
  <link rel="canonical" href="https://auto-x2o.pages.dev/" />
  <!-- 링크 공유 미리보기 (카카오톡·슬랙·링크드인 등). 이미지는 절대 주소여야 크롤러가 읽는다. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="QA Automation" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:url" content="https://auto-x2o.pages.dev/" />
  <meta property="og:title" content="품질 관리 중 생기는 문제를, 바로 도구로 — QA Automation" />
  <meta property="og:description" content="QA 반복 업무를 도구로 자동화합니다. 증적 정리 2시간 → 1시간, 기획서 TC 초안 1시간 → 5분, 8단계 자동 검사 1분 → 10초." />
  <!-- ?v= 는 이미지를 바꿀 때 올린다 — 메신저·SNS 가 예전 미리보기를 붙잡고 있지 않게 -->
  <meta property="og:image" content="https://auto-x2o.pages.dev/assets/og.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="QA Automation — 품질 관리 중 생기는 문제를 바로 도구로 만듭니다" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <!-- 테마 깜빡임 방지: CSS 적용 전에 저장된 테마를 먼저 반영 (기본 라이트) -->
  <script>(function(){try{var t=localStorage.getItem('portfolio-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <!-- 릴(고정 화면) 모드를 첫 화면이 그려지기 전에 켠다. 스크립트가 나중에 켜면 이미 그려진 화면이
       한 번 밀린다(CLS). 동작 줄이기를 켠 사용자는 평범한 세로 문서 그대로 둔다. -->
  <script>(function(){try{if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('has-reel');}catch(e){}})();</script>
  <!-- 본문용 한글 가변 폰트. 막히면 시스템 폰트로 자연히 내려갑니다(styles.css 의 --font). -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- UI 계층: 구조만. 데이터는 config.js, 채우기는 main.js (구축기 1번) -->
  <header class="site-header">
    <div class="site-header-inner">
      <!-- 워드마크 — 아이콘 없이 글자만. 대문자·자간은 styles.css 가 맡습니다. -->
      <a class="brand" href="#top" aria-label="QA Automation, 처음으로">
        <span class="brand-qa">QA</span>
        <span class="brand-word">Automation</span>
      </a>
      <nav class="site-nav">
        <a href="https://github.com/YunseobSongQA/Auto" target="_blank" rel="noopener">GitHub</a>
        <button class="theme-toggle" type="button" aria-label="라이트/다크 모드 전환" aria-pressed="false">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" /></svg>
        </button>
      </nav>
    </div>
  </header>

  <main>
    <!-- 위치 레일 — 지금 몇 번째 화면인지 보여 주고, 눌러서 옮겨 갑니다. 눈금은 main.js 가 만듭니다. -->
    <nav class="rail" data-rail aria-label="화면 이동"></nav>

    <!-- 릴 — 화면은 고정해 두고 스크롤 위치에 맞춰 슬라이드를 바꿔 끼웁니다 (main.js initReel).
         첫 장은 여기, 도구 슬라이드는 config.js 카드로 main.js 가 뒤에 이어 붙입니다. -->
    <div class="reel" id="reel">
      <!-- is-on: 첫 장은 처음부터 켜진 상태로 그린다 (릴이 켜진 채 첫 화면이 그려지므로) -->
      <section class="slide slide--intro is-on" id="top" data-id="top" data-name="소개">
        <div class="slide-inner intro">
          <div class="intro-main">
            <h1 class="intro-title rv" style="--i:0">품질 관리 중 생기는 문제를<br />바로 도구로 만듭니다</h1>
            <p class="lede rv" style="--i:1">
              <span>QA를 하며 마주치는 반복 업무를 자동화합니다.</span>
              <span>증적 수집부터 기획서 기반 테스트케이스 작성, 자동화 테스트까지 필요한 도구를 직접 만들어 실무에 활용합니다.</span>
            </p>

            <!-- 소개 — 누가 만들었고 어디서 무엇을 해 왔는지 짧게 -->
            <div class="bio rv" style="--i:2">
              <div class="bio-head">
                <h2>송윤섭</h2>
                <span class="bio-role">QA Engineer</span>
              </div>
              <dl class="bio-career">
                <div><dt>소속</dt><dd>컴즈</dd></div>
                <div><dt>前</dt><dd>LG CNS 배포 담당 QA</dd></div>
                <div><dt>現</dt><dd>KB국민은행 여신 파트 QA</dd></div>
              </dl>
              <p>반복은 줄이고, 아낀 시간은 목표한 품질에 투자합니다.</p>
            </div>

            <a class="slide-next rv" style="--i:3" href="#qass" data-next>
              도구 둘러보기
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" /></svg>
            </a>
          </div>

          <!-- 한눈에 보기 — 도구마다 실무 적용 시간을 바로 보여 준다(넓은 화면). 줄은 main.js 가 채운다. -->
          <nav class="intro-index rv" style="--i:2" aria-label="도구 한눈에 보기">
            <p class="ix-head">한눈에 보기 <span>실무 적용 시간</span></p>
            <ol data-index></ol>
          </nav>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <p class="footer-brand">송윤섭 · QA Engineer</p>
      <nav class="footer-links">
        <a href="https://github.com/YunseobSongQA/Auto" target="_blank" rel="noopener">GitHub</a>
        <a href="https://qass1.pages.dev/" target="_blank" rel="noopener">QASS</a>
      </nav>
    </div>
  </footer>

  <!-- (A) PC/모바일 강제 전환 토글 — 모바일에서 데스크탑 레이아웃을 미리 검증하기 위한 버튼 -->
  <button id="viewport-toggle" class="viewport-toggle" type="button" aria-pressed="false" title="데스크탑 레이아웃 미리보기 (viewport 강제 전환)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
    <span class="vt-label">PC 화면으로 보기</span>
  </button>

  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
